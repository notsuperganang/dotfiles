# =============================================================================
# KONFIGURASI MONITOR
# File ini bisa ditimpa oleh nwg-displays (GUI untuk atur layout monitor)
# Install: sudo pacman -S nwg-displays
# =============================================================================

# -----------------------------------------------------------------------------
# LAYOUT DUAL SCREEN
# Aktifkan SATU layout saja (pasangan eDP-2 + DP-1), comment yang lain
# -----------------------------------------------------------------------------

# Layout A — Atas/bawah (DP-1 di atas, eDP-2 di bawah, rata tengah horizontal)
# Offset 320px ke kanan agar center: (2560 - 1920) / 2 = 320
monitor = eDP-2, 2560x1440@165, 0x1080, 1.33
monitor = DP-1, 1920x1080@240, 320x0, 1

# Layout B — Kiri/kanan (eDP-2 di kiri, DP-1 di kanan, rata tengah vertikal)
# Lebar logis eDP-2 = 2560 / 1.33 = 1925
# Offset 2px ke bawah agar center: (1083 - 1080) / 2 = 2
# monitor = eDP-2, 2560x1440@165, 0x0, 1.33
# monitor = DP-1, 1920x1080@240, 1925x2, 1

# -----------------------------------------------------------------------------
# MODE LAIN UNTUK DP-1 (ganti baris DP-1 di layout aktif)
# -----------------------------------------------------------------------------

# Mode 2 — Mirror / Presentasi (DP-1 mencerminkan eDP-2)
# monitor = DP-1, 1920x1080@60, 0x0, 1, mirror, eDP-2

# Mode 3 — Extended kiri (DP-1 di sebelah kiri eDP-2)
# monitor = DP-1, 1920x1080@60, -1920x0, 1
